---
# tasks file for ansible-ai-skills

- name: Retrieve user information for "{{ ai_skills_user }}"
  ansible.builtin.user:
    name: "{{ ai_skills_user }}"
  register: _ai_skills_user_info
  failed_when: false

- name: Detect user home directory via shell if user info is unavailable
  ansible.builtin.shell: echo "$HOME"
  register: _ai_skills_user_home_shell
  become: true
  become_user: "{{ ai_skills_user }}"
  changed_when: false
  when: _ai_skills_user_info.home is not defined or _ai_skills_user_info.home == ""

- name: Set home directory variable from user info
  ansible.builtin.set_fact:
    _ai_skills_user_home: "{{ _ai_skills_user_info.home | default('') }}"

- name: Set home directory variable from shell fallback
  ansible.builtin.set_fact:
    _ai_skills_user_home: "{{ _ai_skills_user_home_shell.stdout | trim }}"
  when:
    - _ai_skills_user_home == ""
    - _ai_skills_user_home_shell is defined
    - _ai_skills_user_home_shell.stdout is defined

- name: Debug target user home directory
  ansible.builtin.debug:
    msg: "Target user: {{ ai_skills_user }} | Home directory: {{ _ai_skills_user_home }}"
    verbosity: 1

- name: Locate npx executable on target system
  ansible.builtin.shell: |
    # Add common Node/npm installation paths to PATH
    export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:$PATH"

    # Add fnm and nvm node binary paths directly — these version managers
    # often guard their eval with [[ -o interactive ]] in .zshrc, so
    # profile sourcing alone fails in non-interactive Ansible shells.
    if [ -d "$HOME/.fnm/current/bin" ]; then
      export PATH="$HOME/.fnm/current/bin:$PATH"
    fi
    if [ -d "$HOME/.fnm/aliases/default/bin" ]; then
      export PATH="$HOME/.fnm/aliases/default/bin:$PATH"
    fi
    for _dir in "$HOME/.nvm/versions/node"/*/bin; do
      [ -d "$_dir" ] && export PATH="$_dir:$PATH"
    done

    # Source shell profiles to initialize version managers, asdf, etc.
    if [ -f "$HOME/.bash_profile" ]; then
      . "$HOME/.bash_profile"
    elif [ -f "$HOME/.profile" ]; then
      . "$HOME/.profile"
    fi

    # .zshenv is read on every zsh invocation, even non-interactive
    if [ -f "$HOME/.zshenv" ]; then
      . "$HOME/.zshenv" 2>/dev/null || true
    fi

    if [ -f "$HOME/.zshrc" ]; then
      . "$HOME/.zshrc" 2>/dev/null || true
    elif [ -f "$HOME/.bashrc" ]; then
      . "$HOME/.bashrc" 2>/dev/null || true
    fi

    command -v npx
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ _ai_skills_user_home }}"
  register: _ai_skills_npx_locate
  failed_when: false
  changed_when: false
  become: true
  become_user: "{{ ai_skills_user }}"
  when: ai_skills_npx_path == ""

- name: Set resolved npx path from custom variable
  ansible.builtin.set_fact:
    _ai_skills_resolved_npx: "{{ ai_skills_npx_path }}"
  when: ai_skills_npx_path != ""

- name: Set resolved npx path from located npx
  ansible.builtin.set_fact:
    _ai_skills_resolved_npx: "{{ _ai_skills_npx_locate.stdout | trim if _ai_skills_npx_locate.rc | default(1) == 0 else '' }}"
  when:
    - ai_skills_npx_path == ""
    - _ai_skills_npx_locate is defined
    - _ai_skills_npx_locate.stdout is defined

- name: Attempt to install Node.js when npx is not found (macOS Homebrew)
  ansible.builtin.command: brew install node
  become: false
  when:
    - _ai_skills_resolved_npx == ""
    - ansible_system == "Darwin"
  register: _ai_skills_brew_result
  changed_when: '"already installed" not in _ai_skills_brew_result.stdout'
  failed_when: false

- name: Attempt to install Node.js when npx is not found (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - nodejs
      - npm
    state: present
    update_cache: true
  become: true
  when:
    - _ai_skills_resolved_npx == ""
    - ansible_os_family == "Debian"
  register: _ai_skills_apt_result
  failed_when: false

- name: Attempt to install Node.js when npx is not found (RHEL/Fedora)
  ansible.builtin.dnf:
    name:
      - nodejs
      - npm
    state: present
  become: true
  when:
    - _ai_skills_resolved_npx == ""
    - ansible_os_family == "RedHat"
  register: _ai_skills_dnf_result
  failed_when: false

- name: Re-locate npx after install attempt
  ansible.builtin.shell: |
    export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:$PATH"
    if [ -d "$HOME/.fnm/current/bin" ]; then
      export PATH="$HOME/.fnm/current/bin:$PATH"
    fi
    if [ -d "$HOME/.fnm/aliases/default/bin" ]; then
      export PATH="$HOME/.fnm/aliases/default/bin:$PATH"
    fi
    for _dir in "$HOME/.nvm/versions/node"/*/bin; do
      [ -d "$_dir" ] && export PATH="$_dir:$PATH"
    done
    command -v npx
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ _ai_skills_user_home }}"
  register: _ai_skills_npx_retry
  become: true
  become_user: "{{ ai_skills_user }}"
  changed_when: false
  failed_when: false
  when: _ai_skills_resolved_npx == ""

- name: Update resolved npx path after install attempt
  ansible.builtin.set_fact:
    _ai_skills_resolved_npx: "{{ _ai_skills_npx_retry.stdout | trim if _ai_skills_npx_retry.rc | default(1) == 0 else '' }}"
  when: _ai_skills_resolved_npx == ""

- name: Fail if npx executable cannot be found after all attempts
  ansible.builtin.fail:
    msg: >
      Could not find 'npx' executable for user '{{ ai_skills_user }}'.
      Tried auto-install via Homebrew (macOS), apt (Debian), and dnf (RHEL).
      Please verify Node.js and npm are installed, or set 'ai_skills_npx_path'
      in your playbook or defaults.
  when: _ai_skills_resolved_npx == ""

- name: Debug resolved npx executable path
  ansible.builtin.debug:
    msg: "Using npx executable at: {{ _ai_skills_resolved_npx }}"

- name: Detect installed Node.js version
  ansible.builtin.shell: |
    export PATH="{{ _ai_skills_resolved_npx | dirname }}:$PATH"
    node --version 2>/dev/null | sed 's/^v//'
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ _ai_skills_user_home }}"
  register: _ai_skills_nodejs_version
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ ai_skills_user }}"
  when: _ai_skills_resolved_npx != ""

- name: Determine if Node.js version meets the minimum requirement
  ansible.builtin.set_fact:
    _ai_skills_nodejs_upgrade_required: >-
      {{ (_ai_skills_nodejs_version.stdout | default('0') | trim) is version(ai_skills_nodejs_min_version, '<') }}
  when: _ai_skills_nodejs_version is defined

- name: Debug Node.js version check
  ansible.builtin.debug:
    msg: "Detected Node.js: {{ _ai_skills_nodejs_version.stdout | default('unknown') }} | Minimum: {{ ai_skills_nodejs_min_version }} | Upgrade required: {{ _ai_skills_nodejs_upgrade_required | default(false) }}"
    verbosity: 1

- name: Upgrade Node.js when too old (macOS Homebrew)
  ansible.builtin.command: brew upgrade node
  become: false
  register: _ai_skills_nodejs_brew_result
  changed_when: '"already installed" not in _ai_skills_nodejs_brew_result.stdout'
  failed_when: false
  when:
    - ai_skills_nodejs_upgrade | bool
    - _ai_skills_nodejs_upgrade_required | default(false)
    - ansible_system == "Darwin"

- name: Add Nodesource repository for Node.js {{ ai_skills_nodejs_major }} (Debian/Ubuntu)
  ansible.builtin.shell: |
    curl -fsSL https://deb.nodesource.com/setup_{{ ai_skills_nodejs_major }}.x | bash -
  args:
    executable: /bin/bash
  become: true
  register: _ai_skills_nodejs_nodesource_result
  failed_when: false
  when:
    - ai_skills_nodejs_upgrade | bool
    - _ai_skills_nodejs_upgrade_required | default(false)
    - ansible_os_family == "Debian"

- name: Install upgraded Node.js via apt after Nodesource setup
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true
  become: true
  register: _ai_skills_nodejs_apt_result
  failed_when: false
  when:
    - _ai_skills_nodejs_nodesource_result is defined
    - _ai_skills_nodejs_nodesource_result.rc | default(1) == 0

- name: Add Nodesource repository for Node.js {{ ai_skills_nodejs_major }} (RHEL/Fedora)
  ansible.builtin.shell: |
    curl -fsSL https://rpm.nodesource.com/setup_{{ ai_skills_nodejs_major }}.x | bash -
  args:
    executable: /bin/bash
  become: true
  register: _ai_skills_nodejs_nodesource_rpm_result
  failed_when: false
  when:
    - ai_skills_nodejs_upgrade | bool
    - _ai_skills_nodejs_upgrade_required | default(false)
    - ansible_os_family == "RedHat"

- name: Install upgraded Node.js via dnf after Nodesource setup
  ansible.builtin.dnf:
    name: nodejs
    state: present
  become: true
  register: _ai_skills_nodejs_dnf_result
  failed_when: false
  when:
    - _ai_skills_nodejs_nodesource_rpm_result is defined
    - _ai_skills_nodejs_nodesource_rpm_result.rc | default(1) == 0

- name: Re-locate npx after Node.js upgrade
  ansible.builtin.shell: |
    export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:$PATH"
    if [ -d "$HOME/.fnm/current/bin" ]; then
      export PATH="$HOME/.fnm/current/bin:$PATH"
    fi
    if [ -d "$HOME/.fnm/aliases/default/bin" ]; then
      export PATH="$HOME/.fnm/aliases/default/bin:$PATH"
    fi
    for _dir in "$HOME/.nvm/versions/node"/*/bin; do
      [ -d "$_dir" ] && export PATH="$_dir:$PATH"
    done
    command -v npx
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ _ai_skills_user_home }}"
  register: _ai_skills_npx_relocate
  become: true
  become_user: "{{ ai_skills_user }}"
  changed_when: false
  failed_when: false
  when: _ai_skills_nodejs_upgrade_required | default(false)

- name: Update resolved npx path after Node.js upgrade
  ansible.builtin.set_fact:
    _ai_skills_resolved_npx: "{{ _ai_skills_npx_relocate.stdout | trim if _ai_skills_npx_relocate.rc | default(1) == 0 else _ai_skills_resolved_npx }}"
  when:
    - _ai_skills_npx_relocate is defined
    - _ai_skills_npx_relocate.stdout is defined

- name: Install AI agent skills
  ansible.builtin.shell: |
    # Load user shell environments to ensure local agent config directories are accessible
    if [ -f "$HOME/.bash_profile" ]; then
      . "$HOME/.bash_profile"
    elif [ -f "$HOME/.profile" ]; then
      . "$HOME/.profile"
    fi

    if [ -f "$HOME/.zshenv" ]; then
      . "$HOME/.zshenv" 2>/dev/null || true
    fi

    if [ -f "$HOME/.zshrc" ]; then
      . "$HOME/.zshrc" 2>/dev/null || true
    elif [ -f "$HOME/.bashrc" ]; then
      . "$HOME/.bashrc" 2>/dev/null || true
    fi

    # Run the npx skills add command
    SKILL_ARG=""
    if [ -n "{{ item.skill | default('') }}" ]; then
      SKILL_ARG="--skill {{ item.skill | default('') }}"
    fi
    GLOBAL_ARG=""
    if [ "{{ ai_skills_global | bool | string | lower }}" = "true" ]; then
      GLOBAL_ARG="--global"
    fi
    {{ _ai_skills_resolved_npx }} --yes skills add {{ item.repo }} $SKILL_ARG $GLOBAL_ARG
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ _ai_skills_user_home }}"
    PATH: "/opt/homebrew/bin:/usr/local/bin:/usr/bin:{{ _ai_skills_resolved_npx | dirname }}:{{ ansible_env.PATH | default('/usr/bin') }}"
  loop: "{{ ai_skills }}"
  become: true
  become_user: "{{ ai_skills_user }}"
  register: _ai_skills_install_results
  ignore_errors: "{{ ai_skills_ignore_errors }}"
  changed_when: >
    'Added skill' in _ai_skills_install_results.stdout or
    'Successfully' in _ai_skills_install_results.stdout or
    _ai_skills_install_results.rc == 0

- name: List installed AI agent skills
  ansible.builtin.shell: |
    # Load user shell environments to ensure local agent config directories are accessible
    if [ -f "$HOME/.bash_profile" ]; then
      . "$HOME/.bash_profile"
    elif [ -f "$HOME/.profile" ]; then
      . "$HOME/.profile"
    fi

    if [ -f "$HOME/.zshenv" ]; then
      . "$HOME/.zshenv" 2>/dev/null || true
    fi

    if [ -f "$HOME/.zshrc" ]; then
      . "$HOME/.zshrc" 2>/dev/null || true
    elif [ -f "$HOME/.bashrc" ]; then
      . "$HOME/.bashrc" 2>/dev/null || true
    fi

    # Run list command
    {{ _ai_skills_resolved_npx }} --yes skills list{{ ' --global' if ai_skills_global | bool else '' }}
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ _ai_skills_user_home }}"
    PATH: "/opt/homebrew/bin:/usr/local/bin:/usr/bin:{{ _ai_skills_resolved_npx | dirname }}:{{ ansible_env.PATH | default('/usr/bin') }}"
  become: true
  become_user: "{{ ai_skills_user }}"
  register: _ai_skills_list_output
  changed_when: false

- name: Display installed AI agent skills
  ansible.builtin.debug:
    var: _ai_skills_list_output.stdout_lines
